# What runs on the demo server (one EC2 instance, ADR-002 fallback profile).
# Values come from /opt/taskflow/.env: JWT_SECRET is generated there at first boot and
# never leaves the server; DATABASE_URL and DIRECT_URL (the managed Postgres) are added
# by hand once, see README.md.
# API_IMAGE is written to the same .env by deploy.sh on each release.
services:
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Postgres is a managed database (Neon, ADR-002 update 2026-11-16): the app uses
      # the pooled address, migrations the direct one.
      DATABASE_URL: ${DATABASE_URL:?}
      DIRECT_URL: ${DIRECT_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}

  # HTTPS in front of the API: Caddy gets a Let's Encrypt certificate for SITE_ADDRESS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    # No depends_on: api. Starting Caddy must never start a new API before the
    # migrations have run; until the API is up, Caddy answers 502.

volumes:
  caddy-data:
