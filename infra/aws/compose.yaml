# What runs on the demo server (one EC2 instance, ADR-002 fallback profile).
# Values come from /opt/taskflow/.env, written once by the instance's first boot:
# POSTGRES_PASSWORD and JWT_SECRET are generated there and never leave the server.
# API_IMAGE is written to the same .env by deploy.sh on each release.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: taskflow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 5s
      retries: 20

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:${POSTGRES_PASSWORD}@db:5432/taskflow
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      db:
        condition: service_healthy

  # HTTPS in front of the API: Caddy gets a Let's Encrypt certificate for SITE_ADDRESS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    # No depends_on: api. Starting Caddy must never start a new API before the
    # migrations have run; until the API is up, Caddy answers 502.

volumes:
  db-data:
  caddy-data:
