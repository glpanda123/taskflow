AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TaskFlow demo server (ADR-002 fallback profile): one EC2 instance running the API,
  Postgres and Caddy with Docker Compose, an Elastic IP with HTTPS via sslip.io, an ECR
  repository for the API image, and a GitHub OIDC role that deploys through SSM Run
  Command (no SSH, no stored AWS keys). Uses the account's default VPC.

Parameters:
  GitHubSubject:
    Type: String
    Default: repo:glpanda123@29234732/taskflow@1422935554:ref:refs/heads/master
    Description: >-
      The exact OIDC subject (sub claim) that may deploy: this repository's master branch.
      Repositories created after July 2026 carry the owner and repository IDs after the
      names (repo:OWNER@OWNER_ID/NAME@REPO_ID:ref:refs/heads/BRANCH); older ones use
      repo:OWNER/NAME:ref:refs/heads/BRANCH. A failed attempt shows the real value in
      CloudTrail (event AssumeRoleWithWebIdentity, field userIdentity.userName).
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: An account can hold only one GitHub OIDC provider. Set false if it already exists.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ── Image registry ────────────────────────────────────────────────────────
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: taskflow-api
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  # ── The server ────────────────────────────────────────────────────────────
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TaskFlow demo server - HTTP for the certificate challenge, HTTPS for the API. No SSH.
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # receive Run Command, Session Manager
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly # pull the API image

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  ServerAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: taskflow-demo }]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ServerInstanceProfile
      SecurityGroupIds: [!GetAtt ServerSecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: taskflow-demo }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # First boot only: Docker, Compose, swap, and the server's own secrets.
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # 1 GB of swap: Postgres + Node fit in 1 GB RAM, the swap absorbs spikes.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024 && chmod 600 /swapfile
            mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          mkdir -p /opt/taskflow && cd /opt/taskflow
          # Stop tracing first: the trace goes to the boot log and would print the secrets.
          set +x
          # Generated here, readable by root only, never sent anywhere.
          if [ ! -f .env ]; then
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "JWT_SECRET=$(openssl rand -hex 32)"
              echo "SITE_ADDRESS=${ServerAddress.PublicIp}.sslip.io"
            } > .env
          fi

  ServerAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ServerAddress.AllocationId
      InstanceId: !Ref Server

  # ── Deploys from GitHub Actions (OIDC: no long-lived AWS keys) ─────────────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by the Deploy API workflow on the master branch only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Ref of the provider (when this stack creates it) also orders the creation.
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: push-image-and-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ApiRepository.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

Outputs:
  ApiBaseUrl:
    Description: The API, over HTTPS (the certificate is issued on the first deploy).
    Value: !Sub https://${ServerAddress.PublicIp}.sslip.io/api/v1
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  InstanceId:
    Description: GitHub repository variable AWS_INSTANCE_ID
    Value: !Ref Server
  EcrRepositoryUri:
    Description: Where the API images go
    Value: !GetAtt ApiRepository.RepositoryUri
