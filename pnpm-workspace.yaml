packages:
  - 'apps/*'
  - 'packages/*'

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - prisma

# One TypeScript for the whole monorepo (tools pick the highest installed version otherwise).
overrides:
  typescript: 5.9.3
